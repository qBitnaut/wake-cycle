<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<!--
			Wake Cycle's web shell: Godot 4.7's default shell (the same loader
			script, element ids and canvas sizing) restyled. While the game
			downloads and starts it shows the logo (the boot splash image, at
			the size the desktop build's splash draws it: one device pixel per
			image pixel, pixel-crisp at any devicePixelRatio) and a thin
			loading bar that fills along the logo's vein colours on night navy.
			On the web this loader is the splash (the boot splash's minimum
			display time is desktop-only). tools/audit/web_release_smoke.mjs
			reads #status and #status-progress. Art: tools/art/logo_art.py.
		-->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #fff5db;
	background-color: $GODOT_SPLASH_COLOR;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: $GODOT_SPLASH_COLOR;
	visibility: hidden;
}

#status-splash {
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	image-rendering: pixelated;
	image-rendering: crisp-edges;
}

#status-splash.show-image--false {
	display: none;
}

#status-progress, #status-notice {
	display: none;
}

/* The loading bar: a 4 px vein under the logo. */
#status-progress {
	position: absolute;
	left: 50%;
	top: calc(50% + 96px);
	transform: translateX(-50%);
	width: min(300px, 60vw);
	height: 4px;
	-webkit-appearance: none;
	appearance: none;
	border: 0;
	border-radius: 0;
	background-color: #161630;
	box-shadow: 0 0 0 1px #2a2752;
	color: #7fd9ff;
}

#status-progress::-webkit-progress-bar {
	background-color: #161630;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #9cc8ff, #6ee8f0 60%, #7dffae);
	box-shadow: 0 0 6px rgba(33, 166, 209, 0.75);
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #9cc8ff, #6ee8f0 60%, #7dffae);
	box-shadow: 0 0 6px rgba(33, 166, 209, 0.75);
}

/* Before the size is known: a slow pulse of the vein's light along the track. */
#status-progress:indeterminate {
	background: linear-gradient(90deg, #161630 0%, #21a6d1 50%, #161630 100%) 0 0 / 200% 100% #161630;
	animation: wc-pulse 1.6s linear infinite;
}

#status-progress:indeterminate::-webkit-progress-bar {
	background: transparent;
}

#status-progress:indeterminate::-moz-progress-bar {
	background: transparent;
}

@keyframes wc-pulse {
	from { background-position: 100% 0; }
	to { background-position: -100% 0; }
}

#status-notice {
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	background-color: #241a33;
	border: 1px solid #5b3943;
	color: #fff5db;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

@media (prefers-reduced-motion: reduce) {
	#status-progress:indeterminate {
		animation: none;
		background: #21a6d1;
		opacity: 0.5;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="Wake Cycle">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// The logo at one device pixel per image pixel (as the desktop build draws its
// boot splash: unscaled, centred), halved while that would not fit; the bar
// sits a fixed gap under it.
(function () {
	const img = document.getElementById('status-splash');
	const bar = document.getElementById('status-progress');
	function fit() {
		if (!img.naturalWidth) {
			return;
		}
		const dpr = window.devicePixelRatio || 1;
		let k = 1;
		while (k < 8 && (img.naturalWidth / k / dpr > window.innerWidth * 0.9 || img.naturalHeight / k / dpr > window.innerHeight * 0.6)) {
			k *= 2;
		}
		const w = img.naturalWidth / k / dpr;
		const h = img.naturalHeight / k / dpr;
		img.style.width = w + 'px';
		img.style.height = h + 'px';
		bar.style.top = 'calc(50% + ' + Math.round(h / 2 + 28) + 'px)';
		bar.style.width = Math.round(Math.min(w * 0.6, window.innerWidth * 0.8)) + 'px';
	}
	if (img.complete) {
		fit();
	} else {
		img.addEventListener('load', fit);
	}
	window.addEventListener('resize', fit);
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
